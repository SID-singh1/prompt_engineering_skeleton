<!doctype html>
<meta charset="utf-8">
<title>Prompt Memory — editors harness</title>
<!--
  The real content.js against the real editors the chat sites are built on:

    ?editor=prosemirror   ChatGPT and Claude
    ?editor=quill         Gemini
    ?editor=lexical       a beforeinput-driven editor
    ?editor=textarea      Perplexity-style plain textarea

  Each wires Enter to "send" the way the sites do and counts it in
  window.SENT, so a check can tell a // pick from a message sent. The
  editors load from esm.sh / jsdelivr, so this page needs the network.

  Serve from the repo root (python3 -m http.server) and open
  /extension/tests/editors-harness.html?editor=prosemirror. Storage, the
  fake server and the fake provider come from harness-shim.js; E.signIn()
  signs in (then reload).
-->
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prosemirror-view@1.34.3/style/prosemirror.css">
<style>
  html, body { margin: 0; height: 100%; font: 15px/1.5 system-ui, sans-serif; background: #212121; color: #ddd; }
  main { position: fixed; inset: 0 0 120px 0; padding: 32px; overflow: auto; }
  main p { max-width: 680px; margin: 0 auto 14px; }
  form { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(680px, calc(100% - 140px));
         background: #303030; border-radius: 24px; padding: 14px 18px; box-sizing: border-box; }
  #mount { position: relative; min-height: 26px; }
  #mount .ProseMirror, #mount .ql-editor, #mount[contenteditable], textarea {
    display: block; min-height: 26px; max-height: 200px; overflow-y: auto; outline: none; border: 0; padding: 0;
    width: 100%; background: transparent; color: #eee; font: 15px/1.5 system-ui, sans-serif; white-space: pre-wrap; resize: none; }
  #mount .ql-container { border: 0; font: inherit; }
  #mount .ql-editor { padding: 0; }
  #mount p { margin: 0; }
</style>
<main>
  <p><b>which of these whitening gels is safe for enamel?</b></p>
  <p>The second one: a 16% carbamide peroxide system. The first is a root-canal product that strips calcium.</p>
</main>
<form onsubmit="return false"><div id="mount"></div></form>
<script src="harness-shim.js"></script>
<script type="module">
const kind = new URLSearchParams(location.search).get("editor") || "prosemirror";
const mount = document.getElementById("mount");
window.SENT = 0;
const DEPS = "?deps=prosemirror-model@1.23.0,prosemirror-state@1.4.3,prosemirror-transform@1.10.2,prosemirror-view@1.34.3";

if (kind === "prosemirror") {
  // One copy of prosemirror-model for every package: esm.sh with pinned deps.
  const { EditorState } = await import(`https://esm.sh/prosemirror-state@1.4.3${DEPS}`);
  const { EditorView } = await import(`https://esm.sh/prosemirror-view@1.34.3${DEPS}`);
  const { schema } = await import(`https://esm.sh/prosemirror-schema-basic@1.2.3${DEPS}`);
  const { keymap } = await import(`https://esm.sh/prosemirror-keymap@1.2.2${DEPS}`);
  const { baseKeymap } = await import(`https://esm.sh/prosemirror-commands@1.6.1${DEPS}`);
  const send = keymap({ Enter: () => { window.SENT++; return true; } });
  const view = new EditorView(mount, { state: EditorState.create({ schema, plugins: [send, keymap(baseKeymap)] }) });
  view.dom.id = "prompt-textarea";                  // ChatGPT's id
  window.EDITOR = { el: view.dom, text: () => view.state.doc.textContent,
    clear: () => view.dispatch(view.state.tr.delete(0, view.state.doc.content.size)) };
} else if (kind === "quill") {
  await import("https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js");
  const q = new window.Quill(mount, { modules: { toolbar: false, keyboard: { bindings: {
    send: { key: "Enter", handler: () => { window.SENT++; return false; } } } } } });
  q.root.setAttribute("role", "textbox");
  window.EDITOR = { el: q.root, text: () => q.getText().replace(/\n$/, ""), clear: () => q.setText("") };
} else if (kind === "lexical") {
  const L = await import("https://cdn.jsdelivr.net/npm/lexical@0.17.1/+esm");
  const P = await import("https://cdn.jsdelivr.net/npm/@lexical/plain-text@0.17.1/+esm");
  mount.contentEditable = "true";
  mount.setAttribute("role", "textbox");
  const ed = L.createEditor({ namespace: "harness", onError: (e) => console.error(e) });
  ed.setRootElement(mount);
  P.registerPlainText(ed);
  ed.registerCommand(L.KEY_ENTER_COMMAND, (e) => { e?.preventDefault(); window.SENT++; return true; }, L.COMMAND_PRIORITY_HIGH);
  window.EDITOR = { el: mount, text: () => ed.getEditorState().read(() => L.$getRoot().getTextContent()),
    clear: () => ed.update(() => { L.$getRoot().clear(); L.$getRoot().append(L.$createParagraphNode()); }, { discrete: true }) };
} else {
  mount.outerHTML = '<textarea id="prompt-textarea" rows="1" placeholder="Message"></textarea>';
  const ta = document.getElementById("prompt-textarea");
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); window.SENT++; } });
  window.EDITOR = { el: ta, text: () => ta.value, clear: () => { ta.value = ""; ta.dispatchEvent(new Event("input", { bubbles: true })); } };
}

window.E = {
  kind,
  // Sign in with a token that does not expire until 2100; reload to take effect.
  signIn() { chrome.storage.local.set({ token: "eyJhbGciOiJub25lIn0.eyJleHAiOjQxMDI0NDQ4MDAsInN1YiI6InUxIn0.x", user_id: "u1", email: "u@example.com" }); },
  // A finished rewrite of `original`, as if ⊕ had just run on it.
  draft(original, enhanced) {
    showStreamingDiffModal(original);
    finalizeStreamingModal({ enhanced, original, mode: "deep", direct: true, log_id: "log_e1" });
  },
};
window.EDITOR_READY = true;
const s = document.createElement("script");
s.src = "../content.js";
document.body.appendChild(s);
</script>
