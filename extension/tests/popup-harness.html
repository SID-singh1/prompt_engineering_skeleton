<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Memory — popup harness</title>
<!--
  The real popup.html and popup.js, with chrome.* faked, to look at the
  toolbar popup and the install tab without loading the extension.

    ?tab=1        the install tab / options page (wide) instead of the popup
    ?state=free   no account, no key (the default)
    ?state=in     signed in
    ?state=key    your own key, no account
    ?used=1       after the first rewrite
-->
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const store = { pm_simple_mode: true, anon_limit: 10 };
  if (q.get("state") === "in") Object.assign(store, { token: "t", user_id: "u", email: "friend@example.com" });
  if (q.get("state") === "key") Object.assign(store, { byok_provider: "groq", byok_key: "gsk_test_1234", byok_model: "qwen/qwen3.8-27b" });
  if (q.get("used")) store.pm_stats = { rewrites: 3 };
  const listeners = [];
  const pick = (keys) => {
    const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(store);
    const out = {}; ks.forEach((k) => { if (k in store) out[k] = store[k]; }); return out;
  };
  const changed = (obj) => listeners.forEach((f) => f(obj, "local"));
  window.chrome = {
    storage: {
      local: {
        get(keys, cb) { const r = pick(keys); if (cb) setTimeout(() => cb(r)); return Promise.resolve(r); },
        set(obj, cb) { Object.assign(store, obj); changed(Object.fromEntries(Object.keys(obj).map((k) => [k, { newValue: obj[k] }]))); cb && cb(); return Promise.resolve(); },
        remove(k, cb) { (Array.isArray(k) ? k : [k]).forEach((x) => delete store[x]); changed(Object.fromEntries((Array.isArray(k) ? k : [k]).map((x) => [x, {}]))); cb && cb(); return Promise.resolve(); },
      },
      session: { remove() { return Promise.resolve(); } },
      onChanged: { addListener(f) { listeners.push(f); } },
    },
    runtime: {
      lastError: null,
      getManifest: () => ({ version: "4.9.0" }),
      sendMessage(msg, cb) {
        if (msg.type === "PM_START_GOOGLE_AUTH") {
          setTimeout(() => { chrome.storage.local.set({ token: "t", user_id: "u", email: "friend@example.com" }); cb && cb({ ok: true }); }, 800);
        } else if (msg.type === "PM_VALIDATE_KEY") {
          setTimeout(() => cb && cb({ ok: true, detail: "Key works." }), 400);
        } else cb && cb({});
      },
    },
    commands: { getAll(cb) { cb([{ name: "enhance-prompt", shortcut: "Ctrl+Shift+E" }]); } },
    action: { getUserSettings: () => Promise.resolve({ isOnToolbar: true }) },
    tabs: { create() {} },
  };
  if (q.get("tab")) history.replaceState(null, "", location.pathname + "?onboarding=1&" + q.toString() + location.hash);

  fetch("../popup.html", { cache: "no-store" }).then((r) => r.text()).then((html) => {
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.head.append(...doc.head.querySelectorAll("style"));
    for (const node of [...doc.body.childNodes]) {
      if (node.tagName === "SCRIPT") continue;
      document.body.appendChild(document.importNode(node, true));
    }
    const s = document.createElement("script");
    s.src = "../popup.js";
    document.body.appendChild(s);
  });
</script>
</body>
</html>
