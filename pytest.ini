[pytest]
testpaths = tests
python_files = test_*.py
# The repo root has 14 legacy *_test.py scripts that are manual harnesses, not
# tests: none uses assert, none uses pytest, and several make live API calls
# that cost money. python_files above deliberately does not match them.
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
